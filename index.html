<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>APKeeper — безопасная загрузка APK</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.2s, color 0.2s; }
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }
        body.dark {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --accent: #60a5fa;
        }
        body { background: var(--bg-body); color: var(--text-primary); font-family: 'Segoe UI', system-ui; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 12px 24px; border-radius: 60px; border: 1px solid var(--border); margin-bottom: 30px; }
        .logo { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .btn { background: var(--accent); border: none; padding: 8px 18px; border-radius: 40px; color: white; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn-danger { background: var(--danger); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px; margin-bottom: 30px; }
        .card { background: var(--bg-card); border-radius: 28px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .full-width { grid-column: 1 / -1; }
        h2 { font-size: 1.4rem; margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 16px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-secondary); }
        input, textarea, select { width: 100%; padding: 12px 16px; border-radius: 24px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-primary); }
        .helper-card, .review-card { background: var(--bg-body); border-radius: 20px; padding: 14px; margin-bottom: 12px; }
        .download-btn { background: linear-gradient(105deg, var(--success), #059669); padding: 16px 28px; font-size: 1.2rem; width: 100%; justify-content: center; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-card { background: var(--bg-card); padding: 32px; border-radius: 48px; text-align: center; max-width: 350px; }
        .progress { height: 8px; background: var(--border); border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent); }
        .donate-row { display: flex; gap: 16px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .admin-only { display: none; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--bg-card); padding: 32px; border-radius: 48px; width: 300px; text-align: center; }
        .star-picker i { cursor: pointer; font-size: 1.4rem; color: #cbd5e1; }
        .star-picker i.active-star { color: #fbbf24; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="logo"><i class="fas fa-shield-haltered"></i> APKeeper</div>
        <div style="display: flex; gap: 12px;">
            <button id="adminLoginBtn" class="btn btn-outline"><i class="fas fa-lock"></i> Вход ADM</button>
            <button id="themeSwitcher" class="btn btn-outline"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <!-- Блок скачивания -->
    <div class="card" style="text-align: center;">
        <h2><i class="fas fa-download"></i> Скачать APK</h2>
        <p style="margin-bottom: 16px;">Антивирусная проверка перед загрузкой</p>
        <button id="downloadBtn" class="download-btn btn"><i class="fas fa-shield-virus"></i> СКАЧАТЬ .APK</button>
        <div id="donateBlock" class="donate-row"></div>
    </div>

    <!-- АДМИН-ПАНЕЛЬ (скрыта по умолчанию) -->
    <div id="adminPanel" class="admin-only">
        <div class="grid">
            <div class="card">
                <h2><i class="fas fa-users"></i> Помощники (team)</h2>
                <div id="adminHelpers"></div>
                <div style="border-top: 1px solid var(--border); margin-top: 16px; padding-top: 16px;">
                    <input type="text" id="newHelperName" placeholder="Имя">
                    <input type="text" id="newHelperRole" placeholder="Роль" style="margin-top: 8px;">
                    <input type="url" id="newHelperLink" placeholder="Telegram ссылка" style="margin-top: 8px;">
                    <button id="addHelperBtn" class="btn" style="margin-top: 12px;"><i class="fas fa-plus"></i> Добавить</button>
                </div>
            </div>
            <div class="card">
                <h2><i class="fas fa-star"></i> Отзывы (reviews)</h2>
                <div id="adminReviews"></div>
                <div style="border-top: 1px solid var(--border); margin-top: 16px; padding-top: 16px;">
                    <input type="text" id="newReviewAuthor" placeholder="Имя автора">
                    <textarea id="newReviewText" rows="2" placeholder="Текст отзыва" style="margin-top: 8px;"></textarea>
                    <div class="star-picker" id="starPicker" style="margin: 10px 0;">
                        <i data-star="1" class="far fa-star"></i><i data-star="2" class="far fa-star"></i><i data-star="3" class="far fa-star"></i><i data-star="4" class="far fa-star"></i><i data-star="5" class="far fa-star"></i>
                    </div>
                    <button id="addReviewBtn" class="btn"><i class="fas fa-comment"></i> Добавить отзыв</button>
                </div>
            </div>
            <div class="card full-width">
                <h2><i class="fas fa-sliders-h"></i> Настройки сайта</h2>
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="flex:1"><label>💰 Ссылка доната</label><input type="url" id="donateUrlInput" placeholder="https://..."></div>
                    <div style="flex:1"><label>📦 Активный APK</label><select id="apkSelect"></select></div>
                </div>
                <button id="saveSettingsBtn" class="btn" style="margin-top: 18px;"><i class="fas fa-save"></i> Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Публичный вывод -->
    <div class="grid">
        <div class="card"><h2><i class="fas fa-headset"></i> Наши помощники</h2><div id="publicHelpers"></div></div>
        <div class="card"><h2><i class="fas fa-comment-dots"></i> Отзывы</h2><div id="publicReviews"></div></div>
    </div>
</div>

<div id="virusModal" class="modal"><div class="modal-card"><i class="fas fa-shield-virus" style="font-size: 3rem;"></i><h3>Проверка безопасности</h3><div class="progress"><div class="progress-bar"></div></div><div id="modalStatus">Сканирование...</div></div></div>

<script>
    // ---------- SUPABASE ----------
    const SUPABASE_URL = "https://paacjtojjlwprywgjzry.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhYWNqdG9qamx3cHJ5d2dqenJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDY2MTcsImV4cCI6MjA5MzQ4MjYxN30.3M76ekS7MzYQskaoX9bdJqKutoZ_6OC0EOXv93Rq4WQ";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // Глобальные данные
    let currentApkUrl = "";
    let currentDonateUrl = "";
    let apkSources = [];
    let selectedStarRating = 5;
    let isAdmin = false;
    
    // ---------- ФУНКЦИИ ЗАГРУЗКИ ----------
    async function loadTeam() {
        const { data, error } = await supabase.from("team").select("*");
        if (error) { console.error(error); return []; }
        return data || [];
    }
    async function loadReviews() {
        const { data, error } = await supabase.from("reviews").select("*").eq("status", "approved");
        if (error) { console.error(error); return []; }
        return data || [];
    }
    async function loadSettings() {
        const { data, error } = await supabase.from("settings").select("*").limit(1);
        if (error || !data || data.length === 0) return { donate_url: "", download_url: "" };
        return data[0];
    }
    async function loadApkSources() {
        const { data, error } = await supabase.from("apk_sources").select("*");
        if (error) { console.error(error); return []; }
        return data || [];
    }
    async function loadActiveApk() {
        const { data, error } = await supabase.from("apk_sources").select("*").eq("is_active", true).limit(1);
        if (error || !data || data.length === 0) return null;
        return data[0];
    }
    
    // ---------- СОХРАНЕНИЕ ----------
    async function addTeamMember(name, role, tg_link) {
        const { error } = await supabase.from("team").insert([{ name, role, tg_link }]);
        if (error) { alert("Ошибка: " + error.message); return false; }
        return true;
    }
    async function deleteTeamMember(id) {
        const { error } = await supabase.from("team").delete().eq("id", id);
        if (error) { alert("Ошибка: " + error.message); return false; }
        return true;
    }
    async function addReview(author, text, stars) {
        const { error } = await supabase.from("reviews").insert([{ name: author, text, stars, status: "approved" }]);
        if (error) { alert("Ошибка: " + error.message); return false; }
        return true;
    }
    async function deleteReview(id) {
        const { error } = await supabase.from("reviews").delete().eq("id", id);
        if (error) { alert("Ошибка: " + error.message); return false; }
        return true;
    }
    async function updateSettings(donateUrl, downloadUrl) {
        const { data: existing } = await supabase.from("settings").select("id").limit(1);
        if (existing && existing.length > 0) {
            const { error } = await supabase.from("settings").update({ donate_url: donateUrl, download_url: downloadUrl }).eq("id", existing[0].id);
            if (error) { alert("Ошибка: " + error.message); return false; }
        } else {
            const { error } = await supabase.from("settings").insert([{ donate_url: donateUrl, download_url: downloadUrl, download_count: 0 }]);
            if (error) { alert("Ошибка: " + error.message); return false; }
        }
        return true;
    }
    async function setActiveApk(id) {
        await supabase.from("apk_sources").update({ is_active: false }).neq("id", 0);
        const { error } = await supabase.from("apk_sources").update({ is_active: true }).eq("id", id);
        if (error) { alert("Ошибка активации: " + error.message); return false; }
        return true;
    }
    
    // ---------- ОТРИСОВКА ----------
    async function renderAll() {
        const team = await loadTeam();
        const reviews = await loadReviews();
        const settings = await loadSettings();
        const sources = await loadApkSources();
        apkSources = sources;
        const active = await loadActiveApk();
        currentApkUrl = active ? active.url : (sources[0]?.url || "");
        currentDonateUrl = settings.donate_url || "";
        
        // Публичные блоки
        document.getElementById("publicHelpers").innerHTML = team.map(m => `<div style="padding: 10px; background: var(--bg-body); border-radius: 20px; margin-bottom: 8px;"><b>${escape(m.name)}</b> <span style="color: var(--accent);">${escape(m.role || '')}</span><br>${m.tg_link ? `<a href="${escape(m.tg_link)}" target="_blank" style="font-size:0.8rem;">📩 Связаться</a>` : ''}</div>`).join('') || "<p>Нет данных</p>";
        document.getElementById("publicReviews").innerHTML = reviews.map(r => `<div style="padding: 10px; background: var(--bg-body); border-radius: 20px; margin-bottom: 8px;"><b>${escape(r.name)}</b> ${'⭐'.repeat(r.stars || 5)}<br>“${escape(r.text)}”</div>`).join('') || "<p>Нет отзывов</p>";
        document.getElementById("donateBlock").innerHTML = currentDonateUrl ? `<a href="${escape(currentDonateUrl)}" target="_blank" class="btn btn-outline" style="background: var(--bg-card);"><i class="fas fa-heart" style="color: #f43f5e;"></i> Поддержать</a>` : "";
        
        // Админские блоки (если админ)
        if (isAdmin) {
            document.getElementById("adminHelpers").innerHTML = team.map(m => `<div class="helper-card"><b>${escape(m.name)}</b> <span style="color:var(--accent);">${escape(m.role || '')}</span> — ${m.tg_link ? `<a href="${escape(m.tg_link)}" target="_blank">📞</a>` : '-'}<button class="btn btn-danger btn-sm" style="float:right; padding:4px 12px;" onclick="deleteHelper(${m.id})">✖</button></div>`).join('');
            document.getElementById("adminReviews").innerHTML = reviews.map(r => `<div class="review-card"><b>${escape(r.name)}</b> ${'⭐'.repeat(r.stars || 5)}<br>${escape(r.text)}<button class="btn btn-danger btn-sm" style="float:right;" onclick="deleteReviewById(${r.id})">✖</button></div>`).join('');
            document.getElementById("donateUrlInput").value = currentDonateUrl;
            const select = document.getElementById("apkSelect");
            select.innerHTML = sources.map(s => `<option value="${s.id}" ${s.is_active ? "selected" : ""}>${escape(s.name)}</option>`).join('');
        }
    }
    
    // Глобальные функции для админки
    window.deleteHelper = async (id) => { if(confirm("Удалить?")) { await deleteTeamMember(id); await renderAll(); } };
    window.deleteReviewById = async (id) => { if(confirm("Удалить отзыв?")) { await deleteReview(id); await renderAll(); } };
    
    async function addHelperAction() {
        let name = document.getElementById("newHelperName").value.trim();
        let role = document.getElementById("newHelperRole").value.trim();
        let link = document.getElementById("newHelperLink").value.trim();
        if(!name) return alert("Введите имя");
        await addTeamMember(name, role, link);
        document.getElementById("newHelperName").value = "";
        document.getElementById("newHelperRole").value = "";
        document.getElementById("newHelperLink").value = "";
        await renderAll();
    }
    async function addReviewAction() {
        let author = document.getElementById("newReviewAuthor").value.trim();
        let text = document.getElementById("newReviewText").value.trim();
        if(!author || !text) return alert("Заполните имя и текст");
        await addReview(author, text, selectedStarRating);
        document.getElementById("newReviewAuthor").value = "";
        document.getElementById("newReviewText").value = "";
        await renderAll();
    }
    async function saveSettingsAction() {
        let newDonate = document.getElementById("donateUrlInput").value.trim();
        let selectedId = parseInt(document.getElementById("apkSelect").value);
        await updateSettings(newDonate, "");
        if(selectedId) await setActiveApk(selectedId);
        await renderAll();
        alert("Настройки сохранены!");
    }
    
    // Анимация скачивания
    async function startDownload() {
        if(!currentApkUrl) { alert("APK файл не настроен. Админ добавит ссылку."); return; }
        const modal = document.getElementById("virusModal");
        const bar = document.querySelector(".progress-bar");
        const statusDiv = document.getElementById("modalStatus");
        modal.classList.add("active");
        bar.style.width = "0%";
        statusDiv.innerText = "🔍 Анализ файла...";
        await delay(500); bar.style.width = "35%"; statusDiv.innerText = "🛡️ Проверка сигнатур...";
        await delay(600); bar.style.width = "70%"; statusDiv.innerText = "✅ Безопасно!";
        await delay(500); bar.style.width = "100%"; statusDiv.innerText = "Переадресация...";
        await delay(500);
        modal.classList.remove("active");
        window.open(currentApkUrl, "_blank");
    }
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
    
    // Звёздочки
    function initStarPicker() {
        const stars = document.querySelectorAll("#starPicker i");
        function update(rating) { stars.forEach((s, i) => { if(i<rating) s.className = "fas fa-star active-star"; else s.className = "far fa-star"; }); selectedStarRating = rating; }
        stars.forEach(s => s.addEventListener("click", () => update(parseInt(s.dataset.star))));
        update(5);
    }
    
    // ----- АВТОРИЗАЦИЯ АДМИНА -----
    function showAdminLogin() {
        let pwd = prompt("🔐 Введите пароль администратора:");
        if(pwd === "12345") {
            isAdmin = true;
            document.getElementById("adminPanel").style.display = "block";
            document.getElementById("adminLoginBtn").innerHTML = '<i class="fas fa-user-shield"></i> Админ';
            renderAll();
        } else if(pwd !== null) alert("Неверный пароль!");
    }
    
    // ТЕМА
    function themeInit() {
        const btn = document.getElementById("themeSwitcher");
        const isDark = localStorage.getItem("theme") === "dark";
        if(isDark) document.body.classList.add("dark");
        btn.onclick = () => {
            document.body.classList.toggle("dark");
            localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
        };
    }
    
    function escape(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    
    // СТАРТ
    window.onload = async () => {
        themeInit();
        initStarPicker();
        await renderAll();
        document.getElementById("adminLoginBtn").onclick = showAdminLogin;
        document.getElementById("downloadBtn").onclick = startDownload;
        document.getElementById("addHelperBtn").onclick = addHelperAction;
        document.getElementById("addReviewBtn").onclick = addReviewAction;
        document.getElementById("saveSettingsBtn").onclick = saveSettingsAction;
        // скрыть админ-панель по умолчанию
        document.getElementById("adminPanel").style.display = "none";
    };
</script>
</body>
</html>
